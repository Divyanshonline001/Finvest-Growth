services:
  # 1. Backend API Web Service
  - type: web
    name: finvest-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: TOKEN_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # 2. Frontend Landing Page (Static Site)
  - type: static
    name: finvest-frontend
    runtime: static
    rootDir: frontend
    buildCommand: CI=false npm install && CI=false npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        sync: false
      - key: REACT_APP_DASHBOARD_URL
        sync: false

  # 3. Trading Dashboard (Static Site)
  - type: static
    name: finvest-dashboard
    runtime: static
    rootDir: dashboard
    buildCommand: CI=false npm install && CI=false npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        sync: false
      - key: REACT_APP_FRONTEND_URL
        sync: false
      - key: REACT_APP_RAZORPAY_KEY_ID
        sync: false
